services:
  site:
    image: oven/bun:1
    working_dir: /workspace
    network_mode: host
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    environment:
      IS_ALLOY: ${IS_ALLOY:-true}
      LOVABLE_API_KEY: ${LOVABLE_API_KEY:-}
    command: bash -lc "bun install --frozen-lockfile && bun run dev -- --host 0.0.0.0 --port 5173 --strictPort"

volumes:
  node_modules:
