name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Project
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: bun run build

      # The site is fully static; /api/chat is a Cloudflare Pages Function.
      # Compile functions/ into dist/_worker.js (Pages "advanced mode") so the
      # Function is guaranteed to be included in the deployment instead of
      # relying on wrangler's functions auto-detection during deploy.
      - name: Build Pages Functions
        run: npx wrangler pages functions build functions --outfile dist/_worker.js

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name csifans
