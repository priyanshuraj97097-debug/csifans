<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="80" height="80">
  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C9AFF"/>
      <stop offset="55%" stop-color="#0D6EFD"/>
      <stop offset="100%" stop-color="#0A4FC4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16324F"/>
      <stop offset="100%" stop-color="#0B1D33"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7DF9FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7DF9FF" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bot { transform-origin: 100px 110px; animation: bounce 2.6s ease-in-out infinite; }
      @keyframes bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.015); }
      }
      .eyes { animation: glance 5s ease-in-out infinite; }
      @keyframes glance {
        0%, 18% { transform: translateX(0); }
        28%, 44% { transform: translateX(-7px); }
        54%, 70% { transform: translateX(7px); }
        80%, 100% { transform: translateX(0); }
      }
      .eye-open { transform-box: fill-box; transform-origin: center; animation: blink 3.8s ease-in-out infinite; }
      @keyframes blink {
        0%, 91%, 98%, 100% { transform: scaleY(1); }
        94% { transform: scaleY(0.08); }
      }
      .antenna-glow { animation: glowPulse 2.2s ease-in-out infinite; }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      .antenna-dot { animation: dotPulse 2.2s ease-in-out infinite; }
      @keyframes dotPulse {
        0%, 100% { fill: #7DF9FF; }
        50% { fill: #CFFFFF; }
      }
    </style>
  </defs>

  <g class="bot">
    <!-- soft drop shadow -->
    <ellipse cx="100" cy="182" rx="58" ry="10" fill="#0A4FC4" opacity="0.18"/>

    <!-- antenna -->
    <line x1="100" y1="38" x2="100" y2="18" stroke="#0A4FC4" stroke-width="6" stroke-linecap="round"/>
    <circle class="antenna-glow" cx="100" cy="14" r="12" fill="url(#glow)"/>
    <circle class="antenna-dot" cx="100" cy="14" r="6" fill="#7DF9FF" stroke="#0A4FC4" stroke-width="2.5"/>

    <!-- chat bubble body -->
    <path d="M100 36 C147 36 176 66 176 108 C176 150 147 176 100 176 C86 176 73 173 62 168 L42 182 C38 184 33 181 34 176 L38 152 C29 140 24 125 24 108 C24 66 53 36 100 36 Z" fill="url(#bubble)"/>

    <!-- glass sheen -->
    <path d="M100 40 C60 40 34 64 30 98 C50 82 150 82 170 98 C166 64 140 40 100 40 Z" fill="url(#sheen)"/>

    <!-- headset band -->
    <path d="M42 106 C42 70 68 50 100 50 C132 50 158 70 158 106" fill="none" stroke="#0A4FC4" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
    <rect x="30" y="98" width="18" height="34" rx="9" fill="#0A4FC4"/>
    <rect x="152" y="98" width="18" height="34" rx="9" fill="#0A4FC4"/>
    <path d="M39 128 C39 148 56 156 74 154" fill="none" stroke="#0A4FC4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="78" cy="154" r="7" fill="#0A4FC4"/>
    <circle cx="78" cy="154" r="3.5" fill="#7DF9FF"/>

    <!-- face screen -->
    <rect x="50" y="72" width="100" height="76" rx="30" fill="url(#screen)"/>
    <rect x="50" y="72" width="100" height="76" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

    <!-- eyes -->
    <g class="eyes">
      <g class="eye-open">
        <ellipse cx="80" cy="106" rx="9.5" ry="12" fill="#FFFFFF"/>
        <circle cx="82" cy="108" r="4.5" fill="#0D6EFD"/>
      </g>
      <g class="eye-open">
        <ellipse cx="120" cy="106" rx="9.5" ry="12" fill="#FFFFFF"/>
        <circle cx="122" cy="108" r="4.5" fill="#0D6EFD"/>
      </g>
    </g>

    <!-- smile -->
    <path d="M84 128 Q100 142 116 128" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="64" cy="126" r="5" fill="#7DF9FF" opacity="0.45"/>
    <circle cx="136" cy="126" r="5" fill="#7DF9FF" opacity="0.45"/>
  </g>
</svg>
